# Pre-push: fast checks only, never emulators (plan §9.4). Target < 30 s.
# T1 runs first and alone, through tools/unit-gate.mjs: a failing test fails the push; a
# test over the 100 ms alarm is listed but does not, because on this shared machine the
# alarm fired at random whenever other sessions ran tests. CI's T1 job enforces it.
pre-push:
  piped: true
  commands:
    1_unit:
      run: node tools/unit-gate.mjs
    2_typecheck_and_lint:
      run: pnpm exec concurrently --kill-others-on-fail --raw "pnpm typecheck" "pnpm lint"
