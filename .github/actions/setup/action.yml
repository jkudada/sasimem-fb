name: Setup
description: Node 22, pnpm from packageManager, cached store, frozen install. Optionally Java 21 and the emulator JARs.
inputs:
  emulators:
    description: Also set up Java 21 and cache the Firebase emulator JARs
    default: "false"
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: pnpm
    - run: pnpm install --frozen-lockfile
      shell: bash
    - if: inputs.emulators == 'true'
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 21
    - if: inputs.emulators == 'true'
      uses: actions/cache@v4
      with:
        path: ~/.cache/firebase/emulators
        key: firebase-emulators-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: firebase-emulators-
